# Xcode project used by CI (GitHub Actions) to build an installable .ipa.
# It compiles the same sources as TradeQuote.swiftpm, so Swift Playgrounds and CI stay in sync.
# Generate locally with:  xcodegen generate --spec BuildSupport/project.yml
name: TradeQuote
options:
  bundleIdPrefix: com.tradequote
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
targets:
  QuoteCore:
    type: library.static
    platform: iOS
    sources:
      - path: ../TradeQuote.swiftpm/Sources/QuoteCore
  TradeQuote:
    type: application
    platform: iOS
    sources:
      - path: ../TradeQuote.swiftpm/Sources/AppModule
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: QuoteCore
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: TradeQuote
        # Signing values come from Signing.xcconfig, overridden by CI. Kept on this target only,
        # because the QuoteCore static library must not get a provisioning profile.
        PRODUCT_BUNDLE_IDENTIFIER: $(TQ_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(TQ_TEAM_ID)
        CODE_SIGN_STYLE: $(TQ_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(TQ_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(TQ_PROFILE)
        MARKETING_VERSION: "1.1.2"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Permission strings live in the same Info.plist Swift Playgrounds uses; Xcode adds the standard keys.
        INFOPLIST_FILE: ../TradeQuote.swiftpm/Supporting/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TradeQuote
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
    scheme: {}

