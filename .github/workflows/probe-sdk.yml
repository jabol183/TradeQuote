name: Probe Xcode 27 SDK (temporary)
on:
  push:
    branches: ["fix/ai-extraction-ios27"]
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - run: |
          xcodebuild -version
          swift --version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path); echo "$SDK"
          F=$(find "$SDK/System/Library/Frameworks/FoundationModels.framework" -name "arm64e-apple-ios.swiftinterface" | head -1)
          [ -z "$F" ] && F=$(find "$SDK/System/Library/Frameworks/FoundationModels.framework" -name "*.swiftinterface" | head -1)
          echo "INTERFACE: $F"
          grep -nE "Attachment|[Ii]mage|CGImage|PromptRepresentable|func respond\(" "$F" | head -150
