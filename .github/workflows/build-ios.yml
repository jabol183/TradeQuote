name: Build iOS app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed only to attach the .ipa to a GitHub Release on v* tags

jobs:
  logic-tests:
    name: Quote logic tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: swift test
        run: swift test

  build:
    name: Build unsigned .ipa
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode versions
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec BuildSupport/project.yml

      - name: Archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project BuildSupport/TradeQuote.xcodeproj \
            -scheme TradeQuote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TradeQuote.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*(Sendable|actor|isolat)|\*\* (ARCHIVE|BUILD)" || true
          test -d "$RUNNER_TEMP/TradeQuote.xcarchive/Products/Applications/TradeQuote.app"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log

      - name: Package .ipa
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R TradeQuote.xcarchive/Products/Applications/TradeQuote.app Payload/
          zip -qry TradeQuote-unsigned.ipa Payload
          ls -la TradeQuote-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TradeQuote-unsigned-ipa
          path: ${{ runner.temp }}/TradeQuote-unsigned.ipa
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/TradeQuote-unsigned.ipa
