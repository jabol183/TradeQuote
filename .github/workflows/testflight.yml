name: TestFlight

# Builds a signed release and uploads it to App Store Connect / TestFlight.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.1.
# Setup steps are in TESTFLIGHT.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number shown in TestFlight, e.g. 1.0.0 (leave empty to keep the project's)"
        required: false
        default: ""
  push:
    branches: ["feature/reliable-quoting"]
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Build and upload to TestFlight
    runs-on: xcode-27
    env:
      # Repository variables (Settings → Secrets and variables → Actions → Variables)
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # Required secrets: App Store Connect API key
      ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      # Optional secrets: your own distribution certificate + profile (otherwise Apple cloud signing is used)
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=()
          [ -n "$ASC_KEY_ID" ]      || missing+=("secret APPSTORE_KEY_ID")
          [ -n "$ASC_ISSUER_ID" ]   || missing+=("secret APPSTORE_ISSUER_ID")
          [ -n "$ASC_PRIVATE_KEY" ] || missing+=("secret APPSTORE_API_PRIVATE_KEY")
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "SIGNING=manual" >> "$GITHUB_ENV"
            [ -n "$BUILD_PROVISION_PROFILE_BASE64" ] || missing+=("secret BUILD_PROVISION_PROFILE_BASE64 (needed with BUILD_CERTIFICATE_BASE64)")
          else
            echo "SIGNING=cloud" >> "$GITHUB_ENV"
            [ -n "$TEAM_ID" ]   || missing+=("variable APPLE_TEAM_ID")
            [ -n "$BUNDLE_ID" ] || missing+=("variable BUNDLE_ID")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            for m in "${missing[@]}"; do echo "::error::Missing $m — see TESTFLIGHT.md"; done
            exit 1
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate quote rules before signing
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec BuildSupport/project.yml

      - name: Install App Store Connect API key
        run: |
          KEY_DIR="$RUNNER_TEMP/asc"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          # Accept the .p8 file contents as-is, or base64-encoded.
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install certificate and provisioning profile
        if: env.SIGNING == 'manual'
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PP_PATH="$RUNNER_TEMP/app.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          PROFILE_BUNDLE="${APP_ID#*.}"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PP_PATH" "$dir/$PROFILE_UUID.mobileprovision"
          done

          # The profile is the source of truth for team and bundle ID.
          if [ -n "$BUNDLE_ID" ] && [ "$BUNDLE_ID" != "$PROFILE_BUNDLE" ]; then
            echo "::error::Variable BUNDLE_ID ($BUNDLE_ID) doesn't match the provisioning profile ($PROFILE_BUNDLE)."
            exit 1
          fi
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "TEAM_ID=$PROFILE_TEAM"
            echo "BUNDLE_ID=$PROFILE_BUNDLE"
          } >> "$GITHUB_ENV"
          echo "Using profile '$PROFILE_NAME' for $PROFILE_BUNDLE (team $PROFILE_TEAM)"

      - name: Choose version and build number
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          # Build numbers must always increase; a UTC timestamp does that across reruns and versions.
          BUILD_NUMBER=$(date -u +%y%m%d%H%M%S)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Version: ${VERSION:-<project default>}  Build: $BUILD_NUMBER"

      - name: Archive
        run: |
          set -o pipefail
          args=(
            -project BuildSupport/TradeQuote.xcodeproj
            -scheme TradeQuote
            -configuration Release
            -destination 'generic/platform=iOS'
            -archivePath "$RUNNER_TEMP/TradeQuote.xcarchive"
            TQ_BUNDLE_ID="$BUNDLE_ID"
            TQ_TEAM_ID="$TEAM_ID"
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          )
          [ -n "$VERSION" ] && args+=(MARKETING_VERSION="$VERSION")
          if [ "$SIGNING" = manual ]; then
            args+=(TQ_SIGN_STYLE=Manual TQ_SIGN_IDENTITY="Apple Distribution" TQ_PROFILE="$PROFILE_NAME"
                   OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH")
          else
            # Cloud signing: Xcode signs with an Apple-managed distribution certificate during export.
            args+=(CODE_SIGNING_ALLOWED=NO)
          fi
          if ! xcodebuild archive "${args[@]}" > "$RUNNER_TEMP/archive.log" 2>&1; then
            tail -n 120 "$RUNNER_TEMP/archive.log"
            exit 1
          fi
          grep -E "error:|\*\* ARCHIVE" "$RUNNER_TEMP/archive.log" || true
          test -d "$RUNNER_TEMP/TradeQuote.xcarchive/Products/Applications/TradeQuote.app"

      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :destination string upload" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$PLIST"
          if [ "$SIGNING" = manual ]; then
            /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" "$PLIST"
          fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TradeQuote.xcarchive" \
            -exportOptionsPlist "$PLIST" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log"
          echo "### Uploaded build $BUILD_NUMBER to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in TestFlight after Apple finishes processing (usually 5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/export/*.log
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/app.mobileprovision"

