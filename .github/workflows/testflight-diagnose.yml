name: TestFlight diagnostics

# Reads TestFlight state from App Store Connect and re-sends pending tester invitations.
on:
  push:
    branches: ["diag/testflight-invites"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "pyjwt[crypto]==2.9.0" "requests==2.32.3"
      - name: Diagnose and re-send invites
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
        run: python .github/scripts/testflight_diagnose.py
